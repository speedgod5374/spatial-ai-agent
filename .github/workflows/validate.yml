name: Validate Spatial Studio

on:
  push:
    branches:
      - spatial-studio-arkit-room-model
  pull_request:
    branches:
      - spatial-studio-arkit-room-model

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build web app
        run: npm run build
