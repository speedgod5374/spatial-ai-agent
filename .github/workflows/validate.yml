name: Validate Spatial Studio

on:
  push:
    branches:
      - spatial-studio-arkit-room-model
  pull_request:
    branches:
      - spatial-studio-arkit-room-model

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build web app
        run: npm run build

  reconstruction-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker test dependencies
        run: python -m pip install "numpy<2"
      - name: Compile worker
        run: python -m compileall -q services/reconstruction-worker
      - name: Test camera coordinate conversion
        env:
          PYTHONPATH: services/reconstruction-worker
        run: python -m unittest discover -s services/reconstruction-worker/tests -v
